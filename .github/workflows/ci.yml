name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.13.3
      - run: ruff check src sync.py
      - run: python -m compileall -q src sync.py tests
      - name: offline tests on synthetic files (CPU)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pandas scipy scikit-learn matplotlib requests huggingface_hub \
            rasterio==1.5.1 h5py==3.16.0
          for f in tests/test_*.py; do echo "=== $f"; python "$f" || exit 1; done
